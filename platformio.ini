; Caterpillar bot - PlatformIO project
; Board: Arduino Nano (ATmega328P)
;
; Two environments because Nano clones ship with different bootloaders:
;   nano      -> new Optiboot bootloader (115200 baud upload)  - most genuine/new boards
;   nano_old  -> old bootloader (57600 baud upload)            - most cheap CH340 clones
; If upload fails with "stk500_getsync(): not in sync", try the other one:
;   pio run -e nano_old -t upload

[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    arduino-libraries/Servo@^1.2.2

[env:nano]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328
